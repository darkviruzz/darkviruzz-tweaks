name: Release Module

# Push a version tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`) to build the
# module zip and publish a GitHub release with module.json + module.zip attached.
# Can also be triggered manually via workflow_dispatch with a version input.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Derive version and tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject version and release URLs into module.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tmp="$(mktemp)"
          jq \
            --arg v "$VERSION" \
            --arg dl "https://github.com/${REPO}/releases/download/${TAG}/module.zip" \
            --arg mf "https://github.com/${REPO}/releases/latest/download/module.json" \
            '.version = $v | .download = $dl | .manifest = $mf' \
            module.json > "$tmp"
          mv "$tmp" module.json
          echo "----- module.json -----"
          cat module.json

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles lang README.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
