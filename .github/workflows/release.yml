name: Release Module

# The ONLY way to publish a release (see CLAUDE.md → Release process).
# module.json is the single source of truth for the version: bump it (and "download"),
# add a "## [x.y.z]" section to CHANGELOG.md, merge to main, then either
#   - push the matching tag:  git tag v1.6.0 && git push origin v1.6.0
#   - or run this workflow manually from the Actions tab (releases module.json's version).
# The workflow validates, refuses a tag that doesn't match module.json, builds the zip and
# publishes the CHANGELOG section as the release notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate module
        run: node tools/validate.mjs

      - name: Behaviour tests
        run: node tools/test-features.mjs

      - name: Resolve version from module.json
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version module.json)"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match module.json version $version — bump module.json first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build module.zip
        run: zip -r module.zip module.json scripts styles lang README.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: notes.md
          make_latest: true
          files: |
            module.json
            module.zip
          fail_on_unmatched_files: true
