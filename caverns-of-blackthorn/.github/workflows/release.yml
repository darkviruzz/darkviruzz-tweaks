name: Release Blackthorn

# Push a tag like `cob-v0.1.0` to publish, or trigger manually from the Actions UI.
# The tag prefix keeps this separate from the tweaks module's own `v*` releases.
on:
  push:
    tags:
      - "cob-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0)"
        required: true
      notes:
        description: "Release notes (Markdown). Auto-generated if empty."
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: caverns-of-blackthorn

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version and tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=cob-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#cob-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          npm ci
          pip install Pillow

      - name: Render map and banner
        run: |
          python build/make-map.py
          python build/make-banner.py

      - name: Build compendium packs
        run: npm run build

      - name: Verify cross-references
        run: node build/verify.mjs

      - name: Inject version and release URLs into module.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tmp="$(mktemp)"
          jq \
            --arg v "$VERSION" \
            --arg dl "https://github.com/${REPO}/releases/download/${TAG}/caverns-of-blackthorn.zip" \
            --arg mf "https://github.com/${REPO}/releases/download/${TAG}/module.json" \
            '.version = $v | .download = $dl | .manifest = $mf' \
            module.json > "$tmp"
          mv "$tmp" module.json
          cat module.json

      - name: Build zip
        run: zip -r caverns-of-blackthorn.zip module.json packs assets lang README.md LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Blackthorn ${{ steps.ver.outputs.tag }}
          body: ${{ github.event.inputs.notes }}
          generate_release_notes: true
          files: |
            caverns-of-blackthorn/module.json
            caverns-of-blackthorn/caverns-of-blackthorn.zip
          fail_on_unmatched_files: true
