      text: >-
        Der Drillmeister hat Vorteil auf Angriffswürfe gegen eine Kreatur, wenn sich mindestens zwei
        handlungsfähige Verbündete im Umkreis von 5 ft. dieser Kreatur befinden.
      img: icons/skills/melee/shield-block-gray-yellow.webp
