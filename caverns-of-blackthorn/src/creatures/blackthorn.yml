- key: duergar
  name: Duergar
  size: med
  type: humanoid
  subtype: dwarf
  alignment: Individuell
  cr: 1
  ac: 16
  hp:
    value: 26
    formula: 4d8 + 8
  speed:
    walk: 30
  abilities:
    str: 14
    dex: 11
    con: 14
    int: 11
    wis: 10
    cha: 9
  saves:
    - con
  skills:
    prc: 1
  senses:
    darkvision: 120
  languages:
    - dwarvish
    - undercommon
  img: >-
    https://raw.githubusercontent.com/IsThisMyRealName/too-many-tokens-dnd/main/Duergar/DuergarFemale%20(1).webp
  description: >-
    Grauzwergischer Wachmann an den Handelswegen unter Blackthorn. Er schützt Waren, Vertragspartner und den
    eigenen Rückzug; Vergrößerung und Unsichtbarkeit helfen ihm, Engstellen zu behaupten.
  traits:
    - name: Zwergenzähigkeit
      text: Vorteil auf Rettungswürfe gegen den Zustand Vergiftet.
  actions:
    - name: Kriegspicke
      kind: melee
      ability: str
      reach: 5
      baseItem: warpick
      damage:
        number: 1
        denom: 8
        type: piercing
      text: Ist der Duergar vergrößert, verursacht der Angriff zusätzlich 1W6 Wuchtschaden.
      img: icons/weapons/polearms/pike-flared-brown.webp
    - name: Armbrust, leicht
      kind: ranged
      ability: dex
      range: 80
      long: 320
      properties:
        - amm
        - lod
        - two
      damage:
        number: 1
        denom: 8
        type: piercing
      img: icons/weapons/crossbows/crossbow-simple-brown.webp
      baseItem: lightcrossbow
    - name: Vergrößern
      kind: ability
      activation: bonus
      uses:
        max: 1
        per: lr
      text: >-
        Als Bonusaktion wird der Duergar für 1 Minute Groß. Er hat Vorteil auf Stärkewürfe und
        Stärkerettungswürfe; seine Waffenangriffe verursachen zusätzlich 1W6 Wuchtschaden. Bei
        Bewusstlosigkeit endet die Wirkung. Einmal pro langer Rast.
      img: icons/magic/control/energy-stream-link-large-blue.webp
      activeEffects:
        - name: Vergrößert
          seconds: 60
          changes:
            - key: system.traits.size
              value: lg
              type: override
            - key: system.abilities.str.check.roll.mode
              value: 1
              type: add
            - key: system.abilities.str.save.roll.mode
              value: 1
              type: add
            - key: system.bonuses.mwak.damage
              value: 1d6[bludgeoning]
              type: add
            - key: system.bonuses.rwak.damage
              value: 1d6[bludgeoning]
              type: add
    - name: Unsichtbarkeit
      kind: ability
      uses:
        max: 1
        per: lr
      text: >-
        Einmal pro langer Rast als Aktion: bis zu 1 Stunde unsichtbar einschließlich getragener Ausrüstung.
        Endet bei Angriff, Zauber, erzwungenem Rettungswurf oder Bewusstlosigkeit.
      img: icons/magic/perception/silhouette-stealth-shadow.webp
      activeEffects:
        - name: Unsichtbar
          seconds: 3600
          statuses:
            - invisible
  damageResistances:
    - poison
  tokenVariants:
    - >-
      https://raw.githubusercontent.com/IsThisMyRealName/too-many-tokens-dnd/main/Duergar/DuergarFemale%20(1).webp
    - >-
      https://raw.githubusercontent.com/IsThisMyRealName/too-many-tokens-dnd/main/Duergar/DuergarFemale%20(10).webp
    - >-
