- key: garghuk
  name: Garghuk, Herr von Blackthorn
  size: med
  type: humanoid
  subtype: orc
  alignment: Individuell
  cr: 7
  ac: 18
  hp:
    value: 153
    formula: 18d8 + 72
  speed:
    walk: 30
  abilities:
    str: 20
    dex: 14
    con: 18
    int: 17
    wis: 15
    cha: 17
  saves:
    - str
    - con
    - wis
  skills:
    itm: 2
    ath: 2
    prc: 1
    ins: 1
  senses:
    darkvision: 120
  languages:
    - common
    - orc
    - goblin
    - giant
  actorLink: true
  img: modules/caverns-of-blackthorn/assets/maps/blackthorn-sigil.webp
  description: >-
    Garghuk gewann die Freiheit seines Clans, indem er verfeindete Arbeitsgruppen zusammenbrachte. Der
    außergewöhnlich scharfsinnige Anführer sichert seine Herrschaft durch Schutz, Vorräte und persönliche
    Bindungen. Den Verkauf von Gefangenen betrachtet er als nützliches Geschäft. Einen glatt geschliffenen
    Glücksstein trägt er in einem Beutel unter seiner Rüstung.
  traits: []
  actions:
    - name: Mehrfachangriff
      kind: ability
      text: >-
        Garghuk führt drei Angriffe mit {{item:Kettenzahn}} aus. Er kann einen davon durch {{item:Die Kette
        werfen}} ersetzen.
      img: icons/skills/melee/blade-tips-triple-bent-white.webp
    - name: Kettenzahn
      kind: melee
      ability: str
      reach: 5
      baseItem: greataxe
      properties:
        - hvy
        - two
      damage:
        number: 2
        denom: 12
        type: slashing
      text: >-
        Eine schwere Klinge an einem kurzen Schaft. Um Garghuks freien Unterarm liegt eine griffbereite
        Wurfkette.
      img: icons/weapons/axes/axe-double-engraved-runes.webp
    - name: Die Kette werfen
      kind: ability
      save:
        ability: dex
        dc: 16
        onSave: none
      range: 20
      text: >-
        Ein sichtbares Ziel innerhalb von 20 ft. legt einen Geschicklichkeitsrettungswurf SG 16 ab. Bei
        Misslingen zieht Garghuk es bis zu 15 ft. zu sich, sofern es höchstens Groß ist.
      img: icons/weapons/misc/whip-red-yellow.webp
    - name: Geordneter Angriff
      kind: ability
      activation: bonus
      uses:
        max: 2
        per: lr
      text: >-
        Ein williger Verbündeter innerhalb von 30 ft., der Garghuk hört, kann seine Reaktion für einen
        Waffenangriff verwenden.
  equipment:
    - stein-des-gluecks
- key: targ
  name: Targ, Auge des Gruumsh
  size: med
  type: humanoid
  subtype: orc
  alignment: Individuell
  cr: 5
  ac: 16
  hp:
    value: 97
    formula: 13d8 + 39
  speed:
    walk: 30
  abilities:
    str: 16
    dex: 12
    con: 16
    int: 11
    wis: 18
    cha: 14
  saves:
    - con
    - wis
    - cha
  skills:
    rel: 2
    itm: 1
    ins: 2
  senses:
    darkvision: 120
  languages:
    - common
    - orc
    - abyssal
  actorLink: true
  img: icons/creatures/eyes/humanoid-single-blue.webp
  description: >-
    Gruumsh-Priester und politischer Gegenspieler friedlicherer Clanmitglieder. Ein reisender Glaubensgenosse
    prägte sein bewunderndes Bild Valerias’; Targ möchte den Kontakt nach Highport vertiefen.
  traits:
    - name: Das leere Auge
      text: >-
        Targ kann nicht überrascht werden und hat Vorteil auf Rettungswürfe gegen Illusionen sowie gegen
        Effekte, die seine Gedanken lesen oder ihn blenden würden.
      img: icons/magic/perception/eye-ringed-glow-angry-red.webp
  actions:
    - name: Mehrfachangriff
      kind: ability
      text: Targ führt zwei Angriffe mit {{item:Ritualspeer}} aus.
      img: icons/skills/melee/blade-tips-triple-bent-white.webp
    - name: Ritualspeer
      kind: melee
      ability: str
      reach: 5
      baseItem: spear
      properties:
        - thr
        - mgc
      damage:
        number: 1
        denom: 8
        type: piercing
      img: icons/weapons/polearms/spear-flared-blue.webp
      extraDamage:
        - number: 2
          denom: 6
          type: necrotic
    - name: Gruumshs Speer
      kind: ability
      uses:
        max: 1
        per: lr
      save:
        ability: dex
        dc: 15
        onSave: half
        damage:
          - number: 6
            denom: 8
            type: necrotic
      range: 60
      text: >-
        Einmal pro langer Rast: 60 ft. lange und 5 ft. breite Linie, Geschicklichkeitsrettungswurf SG 15. 6W8
        nekrotischer Schaden, bei Erfolg halbiert.
      img: icons/magic/fire/beam-jet-stream-embers.webp
      target:
        template:
          type: line
          size: '60'
          width: '5'
          units: ft
        affects:
          type: creature
    - name: Das Zeichen setzen
      kind: ability
      activation: bonus
      uses:
        max: 2
        per: lr
      text: >-
        Ein sichtbarer Verbündeter innerhalb von 30 ft. erhält bis zum Ende von Targs nächstem Zug Vorteil auf
        seinen nächsten Angriff. Bei dessen Treffer verursacht er einmal zusätzlich 1W8 nekrotischen Schaden.
        Zweimal pro langer Rast.
      img: icons/magic/symbols/runes-star-blue.webp
    - name: Thaumaturgie
      kind: ability
      spellUuid: Compendium.dnd-players-handbook.spells.Item.phbsplThaumaturg
      spellLevel: 0
      text: >-
        Wirkt @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplThaumaturg]{Thaumaturgie} mit Weisheit;
        Zauber-SG 15, Zauberangriff +7. Beliebig oft.
    - name: Segen
      kind: ability
      spellUuid: Compendium.dnd-players-handbook.spells.Item.phbsplBless00000
      spellLevel: 1
      text: >-
        Wirkt @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplBless00000]{Segen} mit Weisheit;
        Zauber-SG 15, Zauberangriff +7. 2 Anwendungen pro langer Rast.
      uses:
        max: 2
        per: lr
    - name: Bannmagie
      kind: ability
      spellUuid: Compendium.dnd-players-handbook.spells.Item.phbsplDispelMagi
      spellLevel: 3
      text: >-
        Wirkt @UUID[Compendium.dnd-players-handbook.spells.Item.phbsplDispelMagi]{Bannmagie} mit Weisheit;
        Zauber-SG 15, Zauberangriff +7. 1 Anwendungen pro langer Rast.
      uses:
        max: 1
        per: lr
