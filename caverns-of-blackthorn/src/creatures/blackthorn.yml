      text: >-
        Verbündete im Umkreis von 15 ft. des Drillmeisters erhalten +1 auf die Rüstungsklasse, solange der
        Drillmeister bei Bewusstsein ist. Fällt er, geht der Bonus verloren — und die gemischte Linie beginnt
        binnen einer Runde auseinanderzufallen.
      img: icons/equipment/shield/heater-steel-worn.webp
  actions:
    - name: Mehrfachangriff
      kind: ability
