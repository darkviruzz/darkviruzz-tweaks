- key: trank-des-suesswassers
  name: Trank des Süßwassers
  type: consumable
  consumableType: potion
  rarity: common
  weight: 0.5
  price: 50
  img: icons/consumables/potions/bottle-round-corked-pink.webp
  description: >-
    <p>Dieser Trank reinigt bis zu 40 Liter verdorbenes, salziges oder vergiftetes Wasser, sobald er
    hineingegossen wird. Gegen magische Verunreinigung hilft er nicht.</p> <p>Aus dem früheren Ogerbesitz,
    heute in Garghuks verschlossenem Vorrat.</p>
  use:
    activation: action
    consumesSelf: true
- key: leuchtendes-wasser
  name: Fläschchen mit leuchtendem Wasser
  type: consumable
  consumableType: potion
  rarity: common
  weight: 0.5
  price: 0
  img: icons/consumables/potions/bottle-pear-corked-blue.webp
  description: >-
    <p>Klares Wasser aus dem Springbrunnen des Lichts. Beim Abfüllen verliert es seinen Schimmer und wird zu
    gewöhnlichem Trinkwasser. Die Heilkraft wirkt am aktiven Quellbecken.</p>
