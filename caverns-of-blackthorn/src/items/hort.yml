- key: ring-des-schutzes
  name: Ring des Schutzes +2
  type: equipment
  equipmentType: ring
  rarity: veryRare
  attunement: true
  weight: 0
  img: icons/equipment/finger/ring-band-engraved-silver.webp
  description: >-
    <p>Ein schmuckloser Silberreif, innen mit einer abgegriffenen Gravur in einer Sprache, die niemand im Bau
    lesen kann. Aus dem früheren Ogerbesitz, heute in Garghuks verschlossenem Vorrat.</p> <p>Du erhältst einen
    Bonus von +2 auf deine Rüstungsklasse und auf alle Rettungswürfe, solange du diesen Ring trägst.</p>
    <p><em>Erfordert Einstimmung.</em></p>
  effects:
    - name: Ring des Schutzes +2
      img: icons/equipment/finger/ring-band-engraved-silver.webp
      description: +2 auf Rüstungsklasse und alle Rettungswürfe.
      changes:
        - key: system.attributes.ac.bonus
          mode: ADD
          value: 2
        - key: system.bonuses.abilities.save
          mode: ADD
          value: 2
- key: stein-des-gluecks
  name: Stein des Glücks
  type: equipment
  equipmentType: trinket
  rarity: uncommon
  attunement: true
  weight: 1
  img: icons/commodities/gems/pearl-brown.webp
  description: >-
    <p>Ein vom Wasser rundgeschliffener Achat. Garghuk trägt ihn in einem Lederbeutel unter seiner
    Rüstung.</p><p>Nach Einstimmung erhältst du +1 auf Attributswürfe und Rettungswürfe, solange du den Stein
    bei dir trägst.</p>
  effects:
    - name: Stein des Glücks
      img: icons/commodities/gems/pearl-brown.webp
      description: +1 auf Attributswürfe und Rettungswürfe.
      changes:
        - key: system.bonuses.abilities.check
          mode: ADD
          value: 1
        - key: system.bonuses.abilities.save
          mode: ADD
          value: 1
- key: stiefel-der-schnelligkeit
  name: Stiefel der Schnelligkeit
  type: equipment
  equipmentType: trinket
  rarity: rare
  attunement: true
  weight: 1
  img: icons/equipment/feet/boots-leather-engraved-brown.webp
  description: >-
    <p>Erfordert Einstimmung. Als Bonusaktion aktivieren oder deaktivieren: doppelte Bewegungsrate,
    gegnerische Gelegenheitsangriffe haben Nachteil. Insgesamt 10 Minuten Nutzung, aufteilbar; eine lange Rast
    erneuert die Nutzungsdauer. Dauer am Tisch mitführen.</p>
- key: handaxt-plus-2
  name: Handaxt +2
  type: weapon
  weaponType: simpleM
  baseItem: handaxe
  rarity: rare
  weight: 2
  reach: 5
  magicalBonus: 2
  properties:
    - lgt
    - thr
    - mgc
  damage:
    number: 1
    denom: 6
    type: slashing
  img: icons/weapons/axes/axe-tomahawk-engraved.webp
  description: >-
    <p>Zwergenarbeit, an der Schneide nachgeschliffen, im Griff eine eingelegte Kupferrune. Sie stammt
    vermutlich aus einem Überfall auf einen Handelszug bei Dyvers — und die Duergar haben sie schon
    bemerkt.</p> <p>Du erhältst einen Bonus von +2 auf Angriffs- und Schadenswürfe mit dieser magischen
    Waffe.</p>
  range: 20
  long: 60
- key: heiltrank
  name: Heiltrank
  type: consumable
  consumableType: potion
  rarity: common
  weight: 0.5
  price: 50
  img: icons/consumables/potions/bottle-round-corked-red.webp
