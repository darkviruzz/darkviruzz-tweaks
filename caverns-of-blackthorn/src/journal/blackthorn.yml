  - key: ort-05-halle
    name: 05 – Garghuks Halle
    area: 5
    content: >-
      <h2>Was man sieht</h2><blockquote>Zwei gewaltige Stoßzähne rahmen ein erhöhtes Podest. Darüber hängt das
      Dornzeichen Blackthorns. Waffenständer, Säcke und eisenbeschlagene Truhen säumen die Wand; an einem
      kleinen Schrein glimmt eine Lampe. Der Ork auf dem Podest hört aufmerksam zu. Erst als ihr verstummt,
      legt er eine Hand auf die schwere Axt neben sich.</blockquote><h2>Bewohner und Absichten</h2><p>Garghuk
      empfängt hier mit zwei Veteranen und vier Kriegern. Targ hält sich häufig am Schrein auf. Die Halle
      diente den Ogern als Herrschaftssitz; Garghuk hat ihre Trophäen übernommen. Er prüft Angebote nach
      Versorgung, Sicherheit und seinem Führungsanspruch. Seine Kenntnisse vom Tempel stammen aus
      eingetroffenen Berichten und Gerüchten.</p><h2>Bei einem Kampf</h2><p>Garghuk nutzt Leibwache und
      Deckung; Targ unterstützt ihn aus sicherer Reichweite. Beide zusammen machen die Begegnung für vier
      erschöpfte SC gefährlich. Garghuk kann eine Waffenruhe anbieten oder über die südwestliche Leiter
      fliehen. Ein Verfolger kann diese Route abschneiden oder ihm folgen. Sein getragener, eingestimmter
      Glücksstein gewährt +1 auf Attributs- und Rettungswürfe; der Effekt ist auf dem Gegenstand
      hinterlegt.</p><h2>Im Gespräch</h2><p>Begrenzte Abmachungen und echte Zahlung sind Garghuk willkommen.
      Targ fordert einen sichtbaren Nutzen für den Clan. Ein befristeter Waffenstillstand kann beiden genügen.
      Belege, dass sein südliches Vorbild neue Unterwerfung bringt, treffen Targs Hoffnungen auf den Pomarj
      besonders.</p><h2>Funde und Informationen</h2><p>Garghuks Rechnung nennt 1.800 Gold frühere Versorgung
      und 2.400 Gold neue Lieferung. Für die zwölf Gefangenen sind 3.600 Gold angesetzt, weitere 600 hat er
      bereitgestellt. Am Schrein liegt eine orkische Nachricht: Ein Kontakt in Highport lobt Valerias als
      Vorbild. Targ, Garghuk und Hurrek können den Besuch des reisenden Priesters schildern. Garghuk trägt
      [[item:stein-des-gluecks]]. Im verschlossenen Vorrat liegen [[item:ring-des-schutzes]],
      [[item:stiefel-der-schnelligkeit]], [[item:handaxt-plus-2]], zwei [[item:heiltrank]] und ein
      [[item:trank-des-suesswassers]].</p><h2>Wege</h2><p>Der Hauptweg führt nach 03. Im Südwesten erreicht
      man über eine Leiter einen eigenen Canyonpfad nach 06: ungefähr 24 Minuten hin, 25 zurück. Er verläuft
      hoch über dem unteren Canyon in 09.</p>
