              count: 2
            - key: ork-krieger
              count: 6
    after: >-
      <h3>Gildruns Eskorte skalieren</h3><p>Leichter: Gildrun und zwei Duergar; Steeder bleibt als Lasttier
      fern vom Kampf. Standard: vollständige Eskorte. Schwerer: ein tatsächlich alarmierter äußerer Posten
      kommt hinzu. Dafür den Posten aus seiner Szene streichen.</p>
  - key: ort-09-canyon
    name: 09 – Unterer Canyon
    area: 9
    content: >-
      <h2>Was man sieht</h2><blockquote>Wasser drängt zwischen dunklen Felszähnen hindurch. Ein schmaler Weg
      zieht sich an der Wand entlang; unter ihm liegen Abraum und lose Steine. Jeder Schritt klingt kurz gegen
      den Fels, ehe das Rauschen des Stroms ihn verschluckt.</blockquote><h2>Bewohner und Absichten</h2><p>Der
      Pfad dient gelegentlichen Arbeitsgängen und verbindet den Fluss mit der Grabung. Träger oder Verfolger
      kommen aus den tatsächlich bewegten Gruppen. Der gezeichnete Ausschnitt zeigt den unteren
      Flussabschnitt.</p><h2>Bei einem Kampf</h2><p>Auf dem schmalen Pfad bestimmen Sicherung, Deckung und
      Rückzugsmöglichkeiten den Kampf. Ein Fangseil hält einen Fehltritt auf. Ungesicherte Stürze nach ihrer
      tatsächlichen Fallhöhe behandeln; vor einer riskanten Handlung Abstand und darunterliegende Felsen
      beschreiben.</p><h2>Im Gespräch</h2><p>Brakka und Träger können den Abstieg und tragfähige Stellen
      erklären. Mit einem Führer lässt sich die günstigste Passage wählen. Das Rauschen bietet Deckung für
      leise Bewegung, erschwert aber Verständigung über Entfernung.</p><h2>Funde und
      Informationen</h2><p>Sicherungsseile, Kletterhilfen und Flugmagie eröffnen eigene Wege. Bei riskanter
      ungesicherter Passage: Geschicklichkeit (Akrobatik) SG 13; ein Misslingen führt zunächst zum Abrutschen
      an der beschriebenen Stelle und erlaubt Hilfe, sofern jemand eingreifen kann. Im starken Strom verlangt
      das Erreichen einer nahen Felsinsel Stärke (Athletik) SG 15. Ein Misslingen treibt zum zuvor sichtbaren
      nächsten Hindernis.</p><h2>Wege</h2><p>Nach 06 sind es ungefähr 50 Minuten hinauf und 38 hinab. Vom Pfad
      zum Fluss etwa 3 Minuten hinunter, 4 zurück. Der Pfad liegt rund 2.150 ft., der Fluss rund 2.200 ft.
      unter der Oberfläche. Die Verbindung 05–06 verläuft weit darüber.</p>
  - key: ort-10-waldstrasse
    name: 10 – Waldstraße
    area: 10
    content: >-
      <h2>Was man sieht</h2><blockquote>An der Gabelung sind Wagenräder tief in die Erde eingesunken. Ein
      Felsrücken überblickt die Straße. Zwischen den Bäumen glitzert ein Bach; abseits der Spur liegen frisch
      gebrochene Zweige.</blockquote><h2>Bewohner und Absichten</h2><p>Die Lage folgt dem Zeitpunkt des
      Raubzugs: vorher gewöhnlicher Verkehr, währenddessen Späher und Räuber, danach Überlebende und Spuren.
      Der gesamte Trupp umfasst zwölf Orks, vier Bugbears und vier Gnolle. In der Standardaufstellung sind
      sechs Orks, ein Bugbear und zwei Gnolle als Vorhut voraus; der Haupttrupp folgt mit mindestens zehn
      Minuten Abstand.</p><h2>Bei einem Kampf</h2><p>Die Vorhut beobachtet Reisende und versucht, Wagen an der
      Gabelung aufzuhalten. Der Haupttrupp rückt nach einer Meldung oder im Rahmen seines Marsches auf. Vor
      Spielbeginn Positionen und Marschabstand notieren. Felsrücken, Bäume und Bach erlauben Deckung, Umgehung
      und einen Hinterhalt gegen die Räuber.</p><h2>Im Gespräch</h2><p>Der erfahrenste Ork führt die Vorhut
      und will Beute mit geringen Verlusten. Bei klarer Unterlegenheit kann er Gefangene herausgeben und
      abziehen. Ein vereinbarter Schutz der Route, ein Versorgungstausch oder eine glaubhafte Warnung können
      den Raubzug verändern.</p><h2>Funde und Informationen</h2><p>Nach einem Überfall berichten Überlebende
      von geraubten Waren und verschleppten Menschen. Fußspuren begleiten die Schleifspuren der Lasten.
      Wagenbesitzer kennen die gefährdete Handelsroute und können den Auftrag zum Schutz konkretisieren. Die
      tatsächlich verhinderten Überfälle bestimmen, wer und was gerettet wurde.</p><h2>Wege</h2><p>Die Spur
      führt durch den Wald zum Dickicht in 01; Reisezeit und Orientierung folgen dem gewählten Oberflächenweg.
      Gefangene werden über 01–02–03–06–07 nach 08 gebracht.</p>
