  - key: ort-04-gnollhoehle
    name: 04 – Gnollhöhle
    area: 4
    content: >-
      <h2>Was man sieht</h2><blockquote>Häute hängen zwischen den Lagerstellen. Der Geruch nach Rauch,
      gegerbtem Leder und Fleisch liegt schwer in der Luft. Mehrere Gnolle sortieren Jagdgerät; eine
      breitschultrige Gnollin hebt den Kopf und mustert euch, als schätze sie Gewicht und Wert einer
      Beute.</blockquote><h2>Bewohner und Absichten</h2><p>Rukha führt das Rudel. Hier sind gewöhnlich vier
      Gnollkrieger bei ihr; zwei weitere halten Wache in 02. Insgesamt gehören sechzehn Jäger und acht
      abhängige Angehörige zum Rudel. Rukha beansprucht einen lohnenden Anteil am nächsten Raubzug.</p><h2>Bei
      einem Kampf</h2><p>Rukha lässt ihre Jäger gemeinsam ein bedrängtes Ziel angreifen. Bei Gefahr für ihre
      Angehörigen deckt sie deren Rückzug; bei klarer Unterlegenheit bietet sie einen Handel an. Bereits zur
      Jagd oder zum Eingang abgezogene Gnolle fehlen hier.</p><h2>Im Gespräch</h2><p>Nahrung, sichere
      Jagdgebiete und ein Ausweg bei drohender Niederlage sprechen Rukha an. Sie kann eine einzelne Karawane
      verschonen oder den Durchgang an ihrem Lager zusichern. Für Unterstützung gegen Garghuk verlangt sie
      einen greifbaren Vorteil für ihr Rudel.</p><h2>Funde und Informationen</h2><p>Gepackte Vorräte und
      bereitgelegte Waffen weisen auf den geplanten Raubzug. Rukha kennt die vorgesehene Warenroute und nennt
      sie bei einem passenden Handel. Häute, Lebensmittel und Jagdgerät sind der Besitz des
      Rudels.</p><h2>Wege</h2><p>Der Ausgang führt ostwärts zurück nach 03.</p>
    encounters:
