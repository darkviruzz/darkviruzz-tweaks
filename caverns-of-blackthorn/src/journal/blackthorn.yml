key: blackthorn
name: Blackthorn – Orte
party:
  level: 7
  size: 4
pages:
  - key: ort-01-eingang
    name: 01 – Versteckter Eingang
    area: 1
    content: >-
      <h2>Was man sieht</h2><blockquote>Dornige Zweige hängen vor zwei dunklen Öffnungen im Fels. Zwischen
      Schnee und feuchter Erde ziehen sich schmale Pfade durchs Dickicht. Hier und da ist ein Zweig auf
      Schulterhöhe blank gerieben; tiefe Abdrücke folgen demselben Weg.</blockquote><h2>Bewohner und
      Absichten</h2><p>Jäger und Lastenträger nutzen den Zugang auf ihren Wegen zwischen Wald und Höhle.
      Rückkehrer halten am Dickicht inne und prüfen ihre Spur. Die regelmäßige Bewachung steht unten in
      02.</p><h2>Bei einem Kampf</h2><p>Das Dickicht erschwert Bewegung abseits der Pfade und unterbricht die
      Sicht. Ein hier angetroffener Trupp stammt aus dem laufenden Jagd-, Transport- oder Raubunternehmen;
      seine Leute fehlen entsprechend an ihrem anderen Aufenthaltsort. Bei Gefahr versucht ein Rückkehrer, die
      Wache in 02 zu erreichen.</p><h2>Im Gespräch</h2><p>Rückkehrer möchten ihre Angehörigen im Bau schützen.
      Wer offen um Audienz bittet, kann unter Bewachung nach 02 geführt werden. Bei zweifelhafter Absicht:
      Charisma (Überzeugen) SG 15. Gwen kann sich vorstellen und für die Gruppe sprechen; die Wache fragt
      dennoch nach dem Anliegen.</p><h2>Funde und Informationen</h2><p>Gezielte Untersuchung zeigt
      Leiterspuren, Schleifstellen und wiederholte Transporte. Weisheit (Überleben) SG 12 trennt die
      Lastenspuren von Wildwechseln. Wer Träger beobachtet, erkennt ihren Zugang
      unmittelbar.</p><h2>Wege</h2><p>Tunnel und Leiterschacht münden beide in 02. Der Treppenweg dauert
      ungefähr 5 Minuten abwärts und 7 aufwärts; die Leiter 3½ bzw. 4½ Minuten.</p>
  - key: ort-02-pilzhoehle
    name: 02 – Obere Pilzhöhle
    area: 2
    content: >-
      <h2>Was man sieht</h2><blockquote>Vier steingefasste Pilzbeete gliedern die Höhle. Feuchte Erde riecht
      zwischen den prallen Hüten hervor. Unter einer hohen Öffnung lehnt eine Leiter. Am Durchgang hebt eine
      bewaffnete Gestalt die Hand; neben ihr stehen gefüllte Körbe und abgestellte
      Traggestelle.</blockquote><h2>Bewohner und Absichten</h2><p>Ein Orkveteran, sechs Orkkrieger und zwei
      Gnolljäger bewachen die Zugänge. Sie erfragen Anliegen, Waffen und Begleiter. Einer der Krieger
      übernimmt bei vereinbartem Geleit die Begleitung und verlässt dafür seinen Posten.</p><h2>Bei einem
      Kampf</h2><p>Die Pilzbeete bieten je nach Position halbe Deckung. Der Veteran hält den Durchgang; ein
      Krieger läuft über 03, um Meldung zu machen. Bei deutlicher Unterlegenheit bietet die Führung eine
      Waffenruhe an oder zieht sich geordnet zurück. Wer die Leiter besteigt, ist während des langsamen
      Aufstiegs gut sichtbar.</p><h2>Im Gespräch</h2><p>Audienz, Handel und die Behandlung eines Kranken sind
      vertraute Anliegen. Die Wache vereinbart Ziel und Umfang des Geleits. Ein konkreter nützlicher Auftrag
      genügt; bei unbewiesener guter Absicht hilft Charisma (Überzeugen) SG 15.</p><h2>Funde und
      Informationen</h2><p>Die Wache nennt Garghuk als Anführer und beschreibt den Hauptweg. Vorräte,
      Arbeitszeichen und Träger zeigen den geregelten Höhlenbetrieb. Erbeutete Dienstzeichen können einen
      flüchtigen Blick täuschen; ein Posten kann nach Auftraggeber und Begleitung
      fragen.</p><h2>Wege</h2><p>Nach 01 führen Leiter und Treppe. Der Abstieg nach 03 dauert etwa 7 Minuten,
      der Rückweg 9½ Minuten.</p>
    encounters:
