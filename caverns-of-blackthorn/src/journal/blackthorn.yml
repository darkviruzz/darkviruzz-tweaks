  - key: ort-07-siedlung
    name: 07 – Siedlung
    area: 7
    content: >-
      <h2>Was man sieht</h2><blockquote>Zwischen niedrigen Wohnhöfen führen schmale Gassen zu Feuerstellen und
      Werkbänken. Feuchte Wäsche hängt über einem Geländer, irgendwo schlägt ein Hammer. Aus einem Pferch
      dringt das dumpfe Schnauben zottiger Tiere. Am Rand eines Hofes zählt ein Hobgoblin Arbeitszeichen,
      während mehrere Leute auf seine Antwort warten.</blockquote><h2>Bewohner und Absichten</h2><p>Orks und
      Goblinoide teilen elf dicht bewohnte Mehrfamilienhöfe mit rückwärtigen Schlafnischen. Vier Rothés stehen
      im Pferch. Hurrek verwaltet Vorräte und Dienste; Gwens Sippe bewohnt einen eigenen Hofbereich. Die
      westliche Torwache besteht aus sechs Kriegern und einem Veteranen. Zusätzlich sind zwölf Krieger und ein
      Veteran als Reserve verfügbar.</p><h2>Bei einem Kampf</h2><p>Veteranen sichern zunächst die Familien,
      Hurrek organisiert geschützte Sammelplätze. Die Reserve sammelt sich nach einer Meldung für mindestens
      drei Minuten und legt anschließend den Weg zum Einsatzort zurück. Abgestellte oder gefallene Wachen aus
      der Liste streichen. Bei Garghuks Tod beansprucht Targ die Führung, während Hurrek Lebensmittel und
      Schutz organisieren will; ihre Unterstützer reagieren auf die Nachrichten, die sie erhalten.</p><h2>Im
      Gespräch</h2><p>Hurrek vermittelt Kontakte, Unterkunft und einen abgegrenzten Bewegungsbereich. Für
      weitere Führerdienste verlangt er eine von Garghuk anerkannte Abrechnung und Dienstfrist. Gwen kann bei
      ihm unterkommen; eine Aussöhnung mit ihrer Sippe erfordert ein Gespräch mit den Angehörigen. Jeder
      Besucher nennt am Tor sein Anliegen.</p><h2>Funde und Informationen</h2><p>Hurreks Gegenbuch verzeichnet
      geleistete Dienste, Liefertermine und Forderungen. Gepackte Traggestelle zeigen die Vorbereitung des
      nächsten Raubzugs. Hurrek hat Targs Lob für Valerias gehört und weiß von dessen gewünschter
      Gesandtschaft. Ortskundige können Geleit durch 06 und weiter nach 08 vermitteln. Die Vorräte ernähren
      die Wohnhöfe.</p><h2>Wege</h2><p>Westlich führt der bewachte Aufgang nach 06. Zwei östliche Tunnel
      erreichen 08: der nördliche in 4½ Minuten abwärts und 6 zurück, der südliche in 7½ und 10. Zur Fontäne
      führt der Hauptweg über 06.</p>
