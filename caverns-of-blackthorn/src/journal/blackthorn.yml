  - key: ort-08-umschlagplatz
    name: 08 – Duergar-Umschlagplatz
    area: 8
    content: >-
      <h2>Was man sieht</h2><blockquote>Vier Tunnelmündungen öffnen sich um einen Platz voller Kisten und
      Metallbündel. An niedrigen Bänken sitzen Menschen; eiserne Ringe halten ihre Fesseln. Auf einem Tisch
      beschweren Steine mehrere Listen. Eine grauhäutige Wache folgt euren Händen mit den
      Augen.</blockquote><h2>Bewohner und Absichten</h2><p>Zwölf Menschen stehen unter der Bewachung von vier
      Orkkriegern und einem Veteranen. Zwei Duergar verwalten die Waren. Je drei weitere Duergar besetzen die
      beiden äußeren Sperrposten. Zum Liefertermin treffen Gildrun, vier eskortierende Duergar und ihr Steeder
      ein.</p><h2>Bei einem Kampf</h2><p>Die Orkwache sichert die Gefangenen und schickt einen Boten nach 07.
      Die Duergar schützen Waren und Handelszugänge. Gildruns Eskorte deckt ihn und sucht bei drohender
      Niederlage einen äußeren Posten zu erreichen. Weitere Parteien greifen ein, wenn ihre Leute, Güter oder
      vereinbarten Schutzpflichten betroffen sind; ihre Ankunft folgt den tatsächlichen Wegen.</p><h2>Im
      Gespräch</h2><p>Bis zur Übergabe verfügt Garghuk über die Gefangenen, danach Gildrun. Beide akzeptieren
      echte Zahlung. Die Verwalter kennen Rechnung, Termin und Versandziel. Bei einer Freilassung werden
      Rückweg, Begleitung und die Passagen durch 07 und 06 ausdrücklich vereinbart.</p><h2>Funde und
      Informationen</h2><p>Fesseln und Verletzungen sind offen sichtbar. Zwei Gefangene brauchen langsames
      Geleit. Die Lieferliste nennt Betrag und Termin; Gildrun bringt seine Reisekladde bei der Ankunft mit.
      Lila Kleidung und der bekannte Name Gildrun können Erinnerungen an die Lilakittel wecken. Lieferbelege
      und Aussagen vertiefen die Verbindung. Ein Versandziel lautet Highport; der Auftraggeber des
      Weitertransports lässt sich durch Befragung oder spätere Nachforschung
      ermitteln.</p><h2>Wege</h2><p>Zwei westliche Tunnel führen nach 07. Ostwärts und südwärts liegen die
      Duergarposten und dahinter weitere Unterweltwege. Die Gruppe kann Passage aushandeln, beobachten, einen
      Posten überwinden oder einem Transport folgen. Für diese Fortsetzung legt der DM anhand gewählter
      Richtung die nächste Etappe, Versorgung und erreichbaren Siedlungen fest.</p>
    encounters:
      - name: Ausgangsbegegnung
