  - key: ort-06-grabung
    name: 06 – Grabung und Ogerlager
    area: 6
    content: >-
      <h2>Was man sieht</h2><blockquote>Das Rauschen eines Wasserfalls füllt die Höhle. Zwischen frisch
      geschnittenen Blöcken stemmen Oger ihre Werkzeuge in den Fels; bewaffnete Orks beobachten die Arbeit.
      Ein verstärktes Tor sperrt einen seitlichen Lagerbereich ab. Dahinter hocken große und kleine Gestalten
      zwischen Decken und wenigen Bündeln.</blockquote><h2>Bewohner und Absichten</h2><p>Fünf Oger arbeiten
      unter sechs orkischen Aufsehern und einem Veteranen. Brakka gehört zu dieser Schicht. Neunzehn weitere
      Oger leben hinter dem Tor: neun arbeitsfähige Erwachsene, vier Alte und sechs Junge. Die Aufseher
      betrachten den Zwang als Wiedergutmachung für die frühere Ogerherrschaft. Brakka beobachtet Tor,
      Schlüssel und Wachwechsel und will ihre Leute gemeinsam herausbringen.</p><h2>Bei einem Kampf</h2><p>Bei
      einem Aufstand sichern zwei Aufseher das Lagertor, einer läuft nach 07; der Veteran versucht, die
      Arbeiter auseinanderzuhalten. Nach etwa 1½ Minuten erreicht der Bote die Torwache; diese kann nach einer
      weiteren Minute am Aufgang stehen. Weitere Reserve benötigt mindestens drei Minuten zum Sammeln. Die
      Oger können ihre Werkzeuge als Waffen nutzen. Brakka bringt zuerst die Jungen zusammen; zwei Erwachsene
      wollen einen früheren Peiniger verfolgen. Gemeinsam können die Befreiten die Engstelle besetzen und den
      Verkehr unterbrechen.</p><h2>Im Gespräch</h2><p>Brakka hilft mit Ortswissen, wenn ein Plan Lageröffnung,
      Schutz der Angehörigen und einen gangbaren Weg verbindet. Die Aufseher lassen sich mit Garghuks Auftrag,
      einem Gefangenenaustausch oder deutlicher Übermacht zum Einlenken bringen. Ein freier Abzug braucht auch
      eine Lösung für den Posten Richtung 07 oder den langen Aufstieg zur Oberfläche.</p><h2>Funde und
      Informationen</h2><p>Ein Schlüssel liegt beim leitenden Aufseher, ein zweiter bei der Torwache 06–07.
      Die im Fels verankerte Lagerabtrennung hat RK 15 und 40 TP pro tragendem Abschnitt sowie Immunität gegen
      Gift und psychischen Schaden. Das Schloss erfordert Geschicklichkeit mit Diebeswerkzeug SG 15; Aufhebeln
      Stärke SG 20 mit geeignetem Werkzeug. Gemeinsame längere Arbeit kann einen Abschnitt ebenfalls öffnen
      und ist weithin hörbar. Kräne, Lasten und loses Holz bieten weitere Ansatzpunkte. Brakka erinnert sich
      an den Aufstand und die damals neu aufgetauchten Waffen. Das Wasser im unteren Becken ist gewöhnliches
      Flusswasser.</p><h2>Wege</h2><p>Nach 03 führt der lange Aufstieg. Der kurze Aufgang nach 07 dauert 1½
      Minuten, zurück 1 Minute; das Tor steht auf der Siedlungsseite. Ein eigener Pfad führt nach 05. Der
      Abstieg nach 09 dauert ungefähr 38 Minuten, der Rückweg 50. Kletterer und Flieger können die Felswände
      für eigene Wege nutzen.</p>
