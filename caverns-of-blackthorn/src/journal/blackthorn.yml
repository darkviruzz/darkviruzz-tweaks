  - key: ort-03-fontaene
    name: 03 – Springbrunnen des Lichts
    area: 3
    content: >-
      <h2>Was man sieht</h2><blockquote>Die blank getretenen Stufen verlieren sich in einem blassen Schein.
      Mit jedem Schritt wird es heller, bis unten eine weite, moosbewachsene Höhle im Licht liegt. Aus einem
      schmalen Loch im Fels schießt Wasser fast zehn Fuß hoch und fällt rauschend in ein kleines Becken.
      Feiner Nebel steht über Kürbisranken und Pilzbeeten. Hinter einer hohen Trennwand liegt der östliche Weg
      im Schatten; weiter südlich bricht der Boden zur Tiefe ab.</blockquote><h2>Bewohner und
      Absichten</h2><p>Zwei orkische Aufpasser regeln den Besuch der Quelle. Gärtner bearbeiten die Beete,
      Verwundete warten auf ihre Behandlung. Das Licht ist kalt, die feuchte Luft merklich frischer als in den
      Gängen. Die Höhle liegt etwa 500 ft. unter der Oberfläche. Der sieben Fuß hohe Wall aus aufgeschichtetem
      Gestein schirmt den östlichen Weg ab; gespaltene Pilzstiele schließen seine Lücken.</p><h2>Bei einem
      Kampf</h2><p>Bei einem Angriff suchen die Aufpasser Deckung und versuchen Meldung zu machen; die Gärtner
      fliehen. Die Trennwand blockiert Sicht und Licht. Die Klippenkante liegt offen erkennbar am Weg: Wer
      dort kämpft, riskiert durch Schubsen oder ungesichertes Klettern einen Sturz. Das Leuchten zählt als
      helles Licht.</p><h2>Im Gespräch</h2><p>Eine Wundversorgung unter Aufsicht ist ein kleines Zugeständnis.
      Für wiederkehrende Besuche oder eine Gruppe auswärtiger Patienten möchten die Aufpasser Garghuks Zusage.
      Sie können Anwendung und Wasserwege erklären. Rhogar erkennt am Fels und Ablauf, wie das Wasser den
      Untergrund geprägt hat.</p><h2>Funde und Informationen</h2><p>Die heilende Wirkung lässt sich an einem
      Patienten beobachten und selbst erproben. Die Bewohner wissen, dass sie im Quellbecken wirkt. Über ihren
      Ursprung gibt es Vermutungen über Ley-Linien und alte Kräfte des
      Gesteins.<h3>Wirkung</h3><p><strong>Wundversorgung:</strong> Wer am aktiven Becken eine Runde lang
      Quellwasser über eine Wunde fließen lässt, erhält [[/r 2d4+2]] TP zurück; die Blutung kommt zum
      Stillstand. Im Kampf kostet dies eine Aktion, anschließend muss der Kontakt mit dem Wasser bis zum
      Beginn des nächsten eigenen Zuges anhalten. Auch ein Helfer kann das Wasser über die Wunde eines
      Patienten führen. Pro Patient zählt jeweils eine Anwendung.</p><p><strong>Heilbad:</strong> Eine
      ununterbrochene Minute unter der Fontäne oder im aktiven Quellbecken stellt sämtliche TP wieder her.
      Krankheiten, körperliche Verletzungsfolgen und körperlich wirkende magische Flüche weichen: etwa
      Blindheit durch geschädigte Augen, Narben, Verbrennungen, Geschwüre, verkrüppelte Glieder und
      Mumienfäule. Auch Keshras bekannte Schädigung lässt sich so heilen. Abgetrennte Glieder bleiben
      verloren; die Wirkung gilt für Lebende. Flüche auf Gegenständen, Bindungen der Seele und andere
      Wirkungen jenseits körperlicher Schädigung bleiben bestehen.</p><p>Die Quelle kann beliebig oft genutzt
      werden. Alter, Erschöpfung, verbrauchte Zauberplätze und begrenzte Fähigkeiten werden nach ihren
      üblichen Regeln behandelt; Rast ist dafür weiterhin erforderlich. Die Heilkraft ist an das aktive Becken
      gebunden. Abgefülltes Wasser, der Ablauf und die tieferen Auffangbecken enthalten gewöhnliches
      Wasser.</p></p><h2>Wege</h2><p>Zurück nach 02; westlicher Seitenast nach 04 in etwa 20 Sekunden.
      Nordöstlich steigt der Weg nach 05 auf: 6 Minuten hinauf, 4 zurück. Der lange östliche Treppenabstieg
      führt nach 06: 15 Minuten hinab, 20 hinauf. Von dort erreicht man 07. Die gemeinsame Karte von 03 und 06
      stellt diesen langen Treppenweg verkürzt dar.</p>
